name = "reciprocal-ris"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ReciprocalRIS"]
allowNonModules = true # single plain file (no `module` header), so it also runs on live.lean-lang.org

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # no Mathlib-style copyright headers
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc1"

[[lean_lib]]
name = "ReciprocalRIS"
